# Lazygit 0.64+ — Catppuccin Mocha + nvim
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
# Use default keybindings (most stable across versions).

gui:
  nerdFontsVersion: "3"
  showIcons: true
  showFileTree: true
  showRandomTip: false
  mouseEvents: true
  sidePanelWidth: 0.333
  expandFocusedSidePanel: true
  commandLogSize: 8
  showBottomLine: true
  showPanelJumps: true
  border: rounded
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#585b70"
    searchingActiveBorderColor:
      - "#f9e2af"
      - bold
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    selectedRangeBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"

git:
  # Pager for diffs (lazygit 0.64+: git.diffRenderers)
  diffRenderers:
    - colorArg: always
      command: bat --paging=always --style=plain --theme="Catppuccin Mocha"
  autoFetch: true
  autoRefresh: true
  parseEmoji: true
  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"
  allBranchesLogCmds:
    - "git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=medium"
  commit:
    signOff: false
    autoWrapCommitMessage: true
  merging:
    manualCommit: false
  overrideGpg: false
  disableForcePushing: false

os:
  editPreset: "nvim"
  open: "open {{filename}}"
  openLink: "open {{link}}"

refresher:
  refreshInterval: 10
  fetchInterval: 60

update:
  method: never

notARepository: skip
promptToReturnFromSubprocess: true
