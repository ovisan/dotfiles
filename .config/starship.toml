# Starship — https://starship.rs
# Fixed xterm colors. Named blue/cyan and Catppuccin hex go dark on SSH.
# 231 white, 228 yellow, 213 magenta, 120 green, 203 red.

"$schema" = "https://starship.rs/config-schema.json"

format = """
$username\
$hostname\
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$kubernetes\
$cmd_duration\
$character"""

add_newline = false
command_timeout = 1000
scan_timeout = 50

[character]
success_symbol = "[❯](bold fg:213)"
error_symbol = "[❯](bold fg:203)"
vimcmd_symbol = "[❮](bold fg:120)"
vimcmd_visual_symbol = "[❮](bold fg:228)"
vimcmd_replace_symbol = "[❮](bold fg:213)"
vimcmd_replace_one_symbol = "[❮](bold fg:213)"

[username]
style_user = "bold fg:120"
style_root = "bold fg:203"
format = "[$user]($style) in "

[hostname]
ssh_only = true
style = "bold fg:120"
format = "[$ssh_symbol$hostname]($style) in "
ssh_symbol = "🌐 "

[directory]
style = "bold fg:231"
# Always show the full path (never collapse to just the repo name like "mdc")
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold fg:203"

[git_branch]
symbol = " "
style = "bold fg:213"
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "bold fg:203"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
style = "bold fg:228"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold fg:228) "
show_milliseconds = false

[nodejs]
symbol = " "
style = "bold fg:120"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = " "
style = "bold fg:228"
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", ".python-version"]
detect_folders = [".venv", "venv"]

[rust]
symbol = " "
style = "bold fg:203"
detect_files = ["Cargo.toml"]

[golang]
symbol = " "
style = "bold fg:120"
detect_files = ["go.mod", "go.sum", "go.work"]

[docker_context]
symbol = " "
style = "bold fg:231"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[kubernetes]
disabled = true
symbol = " "
style = "bold fg:231"
format = "via [$symbol$context( \\($namespace\\))]($style) "

[os]
disabled = false
style = "bold fg:231"
format = "[$symbol]($style)"

[os.symbols]
Macos = " "

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[battery]
disabled = true

[time]
disabled = true
