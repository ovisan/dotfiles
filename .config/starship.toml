# Starship — https://starship.rs
# Palette aligned with Catppuccin Mocha (Ghostty / nvim / tmux)

"$schema" = "https://starship.rs/config-schema.json"

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 1000
scan_timeout = 50

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold yellow)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_replace_one_symbol = "[❮](bold purple)"

[directory]
style = "bold blue"
# Always show the full path (never collapse to just the repo name like "mdc")
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold mauve"
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
style = "bold yellow"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "
show_milliseconds = false

[nodejs]
symbol = " "
style = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = " "
style = "bold yellow"
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", ".python-version"]
detect_folders = [".venv", "venv"]

[rust]
symbol = " "
style = "bold peach"
detect_files = ["Cargo.toml"]

[golang]
symbol = " "
style = "bold sky"
detect_files = ["go.mod", "go.sum", "go.work"]

[docker_context]
symbol = " "
style = "bold blue"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[kubernetes]
disabled = true
symbol = " "
style = "bold blue"
format = "via [$symbol$context( \\($namespace\\))]($style) "

[os]
disabled = false
style = "bold text"
format = "[$symbol]($style)"

[os.symbols]
Macos = " "

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[battery]
disabled = true

[time]
disabled = true
