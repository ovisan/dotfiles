# ──────────────────────────────────────────────────────────────
# tmux 3.7+ — modern, Catppuccin-aligned config
# Reload: prefix + r   |   Install plugins: prefix + I
# ──────────────────────────────────────────────────────────────

# ── Terminal / true color ─────────────────────────────────────
# Ghostty, Alacritty, iTerm2, Kitty, etc.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-overrides ",*:Tc"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"   # undercurl support (nvim)

# Faster key response (nvim / zsh)
set -s escape-time 0
set -g focus-events on
set -g status-interval 5

# ── Prefix: Ctrl-a (easier than Ctrl-b) ───────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Still allow nested tmux with C-a C-a
bind a last-window

# ── General behaviour ─────────────────────────────────────────
set -g history-limit 100000
set -g display-time 2500
set -g display-panes-time 2000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
setw -g automatic-rename off
set -g set-titles on
set -g set-titles-string "#S · #W · #{pane_current_command}"
set -g aggressive-resize on
set -g remain-on-exit off
set -g detach-on-destroy off

# Activity
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# ── Key bindings ──────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Splits — intuitive, keep cwd
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (no prefix): Ctrl-Shift-arrows
bind -n C-S-Left  select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up    select-pane -U
bind -n C-S-Down  select-pane -D

# Vim-style pane navigation with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation (no prefix): Shift-arrows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Window swap
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Quick window select (prefix + 1..9 already works; add 0 → window 10)
bind 0 select-window -t :10

# Toggle synchronize-panes
bind S set-window-option synchronize-panes \; display-message "sync #{?pane_synchronized,on,off}"

# Kill pane / window without confirm prompt noise
bind x kill-pane
bind X kill-window

# Clear history
bind C-l send-keys C-l \; clear-history

# ── Copy mode (vi) ────────────────────────────────────────────
setw -g mode-keys vi
set -g status-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# macOS clipboard via tmux-yank; also support reattach if present
if-shell "command -v pbcopy >/dev/null" {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
}

# ── Appearance (Catppuccin Mocha — matches Ghostty / nvim) ────
# Fallback styles if plugin not yet installed
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines heavy

# Dim inactive panes slightly without muddy greys
set -g window-style "fg=#a6adc8,bg=default"
set -g window-active-style "fg=#cdd6f4,bg=default"

# ── Plugins (TPM) ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'cboone/tmux-binding-help'
set -g @plugin 'nyanko3141592/tmux-zellij-shortcut'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Catppuccin options (applied when plugin loads)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M"

# Resurrect / continuum — auto-save & restore sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Yank
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'

# ── TPM bootstrap (install if missing) ────────────────────────
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' {
  run-shell 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'
}

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Status modules must run AFTER catppuccin is loaded by TPM
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
